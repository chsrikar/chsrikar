<svg width="1200" height="40" viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#190B12;stop-opacity:0"/>
      <stop offset="25%" style="stop-color:#451126;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#701A3D;stop-opacity:0.8">
        <animate attributeName="stop-opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" style="stop-color:#451126;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#190B12;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#divGrad)" stroke-width="1.5"/>
  
  <circle cx="600" cy="20" r="3" fill="#C77B9B" opacity="0.9">
    <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="400" cy="20" r="1.5" fill="#E5B5C7" opacity="0.6"/>
  <circle cx="800" cy="20" r="1.5" fill="#E5B5C7" opacity="0.6"/>
</svg>